# Values for the kube-prometheus-stack Helm chart.
# Tuned small for a deploy/demo/destroy cluster: short retention, modest
# resource requests, and a Grafana admin password set for the demo.

grafana:
  adminPassword: "observability-demo"  # demo only; rotate or template for anything real
  defaultDashboardsEnabled: true
  service:
    type: ClusterIP # accessed via kubectl port-forward in demo.sh

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    # Discover ServiceMonitors / PodMonitors in all namespaces, not just those
    # carrying the chart's release label. Lets the sample app be scraped.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: "null"
      routes:
        # Critical alerts do not stop at a dashboard: they hand off to the
        # aws-incident-responder runbook (n8n on ECS Fargate), which asks Claude
        # for a plain-English summary, posts an incident card to Slack, attempts
        # remediation, and re-checks the alert before it resolves or escalates.
        # This is what makes observability part of the platform loop:
        # detect (here) -> triage/summarize -> remediate -> verify -> escalate.
        - matchers: ['severity = "critical"']
          receiver: "incident-responder"
          continue: true
    receivers:
      # Default sink is a no-op so the demo does not require a real endpoint.
      - name: "null"
      # Webhook into the incident-responder runbook. URL is the n8n webhook
      # exposed by the aws-incident-responder stack (ALB + ACM + Route53); set it
      # per environment. Same detect->runbook contract as a CloudWatch alarm ->
      # SNS -> n8n, just sourced from Prometheus instead of CloudWatch.
      - name: "incident-responder"
        webhook_configs:
          - url: "https://incident-responder.internal.example.com/webhook/prometheus"
            send_resolved: true

# Keep node-exporter and kube-state-metrics on (default) for real node signals.
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
